name: Deploy TNWN site to GitHub Pages

# The full site (all pages, live data, every model-map render) is built by
# the local weather center and published to the gh-pages branch by
# publish_site.py on every update cycle. This workflow now only MIRRORS
# that branch into GitHub Pages — CI runners cannot render the GRIB model
# maps, so building here would strip the models from the public site.
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"   # fallback mirror; publishes also dispatch this workflow directly

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # cancel-in-progress:false (2026-10-05): pushes land every 2-10 min while
  # a 700 MB Pages deploy takes 5-10 min - cancelling in-flight runs let a
  # burst of pushes starve ALL deployments (every run 15:20-16:40 ET today
  # was 'cancelled'; the public CDN froze ~70 min stale). Queued runs
  # serialize instead; each still deploys its ref, so the newest always lands.
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages          # the built site (updated by the weather center)

      - name: Check the build is present
        run: test -f index.html || { echo "gh-pages has no site build yet"; exit 1; }

      - name: Configure Pages (auto-enable on first run)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: mirror
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
