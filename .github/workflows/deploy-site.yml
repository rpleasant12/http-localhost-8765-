name: Deploy TNWN site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"   # refresh live data every 30 minutes

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install site dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests numpy scipy xarray cfgrib eccodes pyproj Pillow h5py

      - name: Build the site with live data
        run: python github_deploy.py --pages --warm-seconds 240

      - name: Configure Pages (auto-enable on first run)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Portable copy of the built site on the gh-pages branch (single orphan
  # commit each run, so the branch never grows history). Any free host —
  # Netlify, Cloudflare Pages, Vercel — can serve directly from this branch.
  publish-branch:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: artifact
      - name: Extract built site
        run: |
          mkdir site
          tar -xf artifact/artifact.tar -C site
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          force_orphan: true
          commit_message: "Site build ${{ github.sha }}"
