# Cloudflare Worker: TNWN membership (accounts, Stripe, premium content).
# One-time setup: see DEPLOY_MEMBERSHIP.md. Secrets live in the dashboard /
# `wrangler secret put` - NEVER in this file or the git repo.
name = "tnwn-members"
main = "src/worker.js"
compatibility_date = "2026-09-15"

# Free-tier databases: users + payments (created by `wrangler d1 create`,
# then paste the real database_id here).
[[d1_databases]]
binding = "DB"
database_name = "tnwn-members"
database_id = "9a9ee299-ef39-4638-9544-50dadf69d4c2"

# Members-only bucket - DISABLED for now: R2 is not activated on this
# account yet (needs the one-time dashboard enable). Deploying with a
# binding to a nonexistent bucket fails, so the worker runs WITHOUT it:
# accounts/billing/admin (D1) all work; the premium library route returns
# a clean 503. Re-enable (uncomment) as soon as `wrangler r2 bucket create
# tnwn-premium` succeeds, then redeploy + fill premium/ per
# DEPLOY_MEMBERSHIP.md §5.
# [[r2_buckets]]
# binding = "BUCKET"
# bucket_name = "tnwn-premium"

[vars]
# Public site origin - the ONLY origin allowed to call the worker with
# credentials (CORS). No secrets here.
SITE_URL = "https://rpleasant12.github.io/http-localhost-8765-"
